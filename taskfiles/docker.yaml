version: "3"

vars:
  G_BUILD_SCRIPT: "{{.ROOT_DIR}}/tools/docker/build.sh"
  G_SPIDER_COMPOSE_DIR: "{{.ROOT_DIR}}/tools/deployment/spider-compose"

tasks:
  build:
    cmds:
      - task: "build-storage"
      - task: "build-scheduler"
      - task: "build-worker"

  build-storage:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' storage"

  build-scheduler:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' scheduler"

  build-worker:
    deps: [":init"]
    cmd: "'{{.G_BUILD_SCRIPT}}' worker"

  compose:validate:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml config --quiet"

  compose:up:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml up --detach --wait"

  compose:down:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml down"

  compose:clean:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --file compose.yaml down --volumes --remove-orphans"

  compose:local:up:
    deps: ["build"]
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: >-
      SPIDER_PULL_POLICY="never"
      SPIDER_SCHEDULER_IMAGE_REF="$(cat '{{.ROOT_DIR}}/build/spider-scheduler-image.id')"
      SPIDER_STORAGE_IMAGE_REF="$(cat '{{.ROOT_DIR}}/build/spider-storage-image.id')"
      SPIDER_WORKER_IMAGE_REF="$(cat '{{.ROOT_DIR}}/build/spider-worker-image.id')"
      docker compose --env-file .env.example up --detach --wait

  compose:local:down:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: "docker compose --env-file .env.example --file compose.yaml down"

  compose:local:clean:
    dir: "{{.G_SPIDER_COMPOSE_DIR}}"
    cmd: >-
      docker compose --env-file .env.example --file compose.yaml
      down --volumes --remove-orphans
