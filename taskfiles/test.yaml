version: "3"

includes:
  toolchains: "toolchains.yaml"

vars:
  G_UNIT_TEST_BINARY: "{{.G_BUILD_SPIDER_DIR}}/tests/wolf/unitTest"
  G_TEST_VENV_DIR: "{{.G_BUILD_DIR}}/test-venv"
  G_TEST_VENV_CHECKSUM_FILE: "{{.G_BUILD_DIR}}/test#venv.md5"

  # MariaDB testing config
  G_MARIADB_DATABASE: "spider-db"
  G_MARIADB_USERNAME: "spider-user"
  G_MARIADB_PASSWORD: "spider-password"

tasks:
  cpp-unit-tests:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-wolf-unit-tests-executor"

  cpp-integration:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-wolf-integration-tests-executor"

  spider-py-unit-tests:
    cmds:
      - task: "wolf-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-py-unit-tests-executor"

  rust-unit-tests:
    deps:
      - ":build:rust"
    cmds:
      - task: "huntsman-mariadb-storage-task-executor"
        vars:
          STORAGE_TASK: "spider-huntsman-unit-tests-executor"

  build-unit-test:
    internal: true
    deps:
      - task: ":build:cpp-target"
        vars:
          TARGETS: ["spider_task_executor", "unitTest", "worker_test"]

  venv:
    internal: true
    vars:
      CHECKSUM_FILE: "{{.G_TEST_VENV_CHECKSUM_FILE}}"
      OUTPUT_DIR: "{{.G_TEST_VENV_DIR}}"
    sources:
      - "{{.ROOT_TASKFILE}}"
      - "{{.TASKFILE}}"
      - "requirements-dev.txt"
    generates: ["{{.CHECKSUM_FILE}}"]
    run: "once"
    deps:
      - ":init"
      - task: ":utils:checksum:validate"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]
    cmds:
      - task: ":utils:misc:create-venv"
        vars:
          LABEL: "test"
          OUTPUT_DIR: "{{.OUTPUT_DIR}}"
          REQUIREMENTS_FILE: "{{.ROOT_DIR}}/requirements-dev.txt"
      # This command must be last
      - task: ":utils:checksum:compute"
        vars:
          CHECKSUM_FILE: "{{.CHECKSUM_FILE}}"
          INCLUDE_PATTERNS: ["{{.OUTPUT_DIR}}"]

  # A generic wrapper that runs the given task with a MariaDB storage backend for Spider Wolf.
  #
  # @param {string} STORAGE_TASK The task to execute. The task must accept no parameters other than
  # `SPIDER_STORAGE_URL`, which is set to the MariaDB instance URL.
  wolf-mariadb-storage-task-executor:
    internal: true
    vars:
      MARIADB_CONTAINER_NAME:
        # Normalize UUID casing: macOS generates uppercase while Linux generates lowercase.
        sh: "uuidgen | tr '[:upper:]' '[:lower:]' | sed 's/^/spider-mariadb-/'"
      MARIADB_PORT:
        sh: "tools/scripts/get_free_port.py"
    requires:
      vars: ["STORAGE_TASK"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |-
        tools/scripts/mariadb/start.py \
        --name "{{.MARIADB_CONTAINER_NAME}}" \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - defer: |-
          {{.ROOT_DIR}}/tools/scripts/mariadb/stop.py \
          --name "{{.MARIADB_CONTAINER_NAME}}"
      - |-
        tools/scripts/mariadb/wolf/init_db.py \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - task: "{{.STORAGE_TASK}}"
        vars:
          SPIDER_STORAGE_URL:
            "jdbc:mariadb://127.0.0.1:{{.MARIADB_PORT}}/{{.G_MARIADB_DATABASE}}?\
            user={{.G_MARIADB_USERNAME}}&password={{.G_MARIADB_PASSWORD}}"

  # A generic wrapper that runs the given task with a MariaDB storage backend.
  #
  # @param {string} STORAGE_TASK The task to execute. The task must accept exactly the following
  # parameters for database connection:
  # - MARIADB_PORT
  # - MARIADB_DATABASE
  # - SPIDER_STORAGE_DB_USERNAME
  # - SPIDER_STORAGE_DB_PASSWORD
  huntsman-mariadb-storage-task-executor:
    internal: true
    vars:
      MARIADB_CONTAINER_NAME:
        # Normalize UUID casing: macOS generates uppercase while Linux generates lowercase.
        sh: "uuidgen | tr '[:upper:]' '[:lower:]' | sed 's/^/spider-mariadb-/'"
      MARIADB_PORT:
        sh: "tools/scripts/get_free_port.py"
    requires:
      vars: ["STORAGE_TASK"]
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |-
        tools/scripts/mariadb/start.py \
        --name "{{.MARIADB_CONTAINER_NAME}}" \
        --port "{{.MARIADB_PORT}}" \
        --database "{{.G_MARIADB_DATABASE}}" \
        --username "{{.G_MARIADB_USERNAME}}" \
        --password "{{.G_MARIADB_PASSWORD}}"
      - defer: |-
          {{.ROOT_DIR}}/tools/scripts/mariadb/stop.py \
          --name "{{.MARIADB_CONTAINER_NAME}}"
      - task: "{{.STORAGE_TASK}}"
        vars:
          MARIADB_PORT: "{{.MARIADB_PORT}}"
          MARIADB_DATABASE: "{{.G_MARIADB_DATABASE}}"
          SPIDER_STORAGE_DB_USERNAME: "{{.G_MARIADB_USERNAME}}"
          SPIDER_STORAGE_DB_PASSWORD: "{{.G_MARIADB_PASSWORD}}"

  # Internal task that runs all spider-py's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-py-unit-tests-executor:
    internal: true
    env:
      # Don't create __pycache__ directories in the source tree.
      PYTHONDONTWRITEBYTECODE: "1"
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.G_SRC_PYTHON_DIR}}"
    cmd: "uv run pytest"

  # Internal task that runs all Spider Wolf's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-wolf-unit-tests-executor:
    internal: true
    env:
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.ROOT_DIR}}"
    deps:
      - "build-unit-test"
    cmd: "{{.G_UNIT_TEST_BINARY}}"

  # Internal task that runs all Spider Wolf's integration tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-wolf-integration-tests-executor:
    internal: true
    env:
      SPIDER_STORAGE_URL: "{{.SPIDER_STORAGE_URL}}"
    requires:
      vars: ["SPIDER_STORAGE_URL"]
    dir: "{{.G_BUILD_SPIDER_DIR}}"
    deps:
      - "venv"
      - task: ":build:cpp-target"
        vars:
          TARGETS: [
            "spider_task_executor",
            "worker_test",
            "client_test",
            "spider_worker",
            "spider_scheduler",
            "integrationTest"
          ]
    cmds:
      - |-
        . {{.G_TEST_VENV_DIR}}/bin/activate
        {{.G_TEST_VENV_DIR}}/bin/pytest tests/wolf/integration

  # Internal task that runs all Spider Huntsman's unit tests.
  #
  # @param {string} SPIDER_STORAGE_URL An URL pointing to the MariaDB instance.
  spider-huntsman-unit-tests-executor:
    internal: true
    vars:
      # TDL packages are staged under `${G_TDL_PACKAGES_DIR}/<package_name>/lib<package_name>.so`
      # so that the `spider-task-executor` binary can resolve them via the on-disk layout it
      # documents.
      G_TDL_PACKAGES_DIR: "{{.G_BUILD_DIR}}/tdl_packages"
      G_RUST_RELEASE_DIR: "{{.G_RUST_BUILD_DIR}}/release"
    env:
      MARIADB_PORT: "{{.MARIADB_PORT}}"
      MARIADB_DATABASE: "{{.MARIADB_DATABASE}}"
      SPIDER_STORAGE_DB_USERNAME: "{{.SPIDER_STORAGE_DB_USERNAME}}"
      SPIDER_STORAGE_DB_PASSWORD: "{{.SPIDER_STORAGE_DB_PASSWORD}}"
      SPIDER_TDL_PACKAGE_COMPLEX: "{{.G_TDL_PACKAGES_DIR}}/complex/libcomplex.so"
      SPIDER_TDL_PACKAGE_DIR: "{{.G_TDL_PACKAGES_DIR}}"
      SPIDER_TASK_EXECUTOR_BIN: "{{.G_RUST_RELEASE_DIR}}/spider-task-executor"
      SPIDER_TEST_INSTRUMENT_OUTPUT_DIR:
        sh: "echo {{.G_BUILD_DIR}}/spider-instrument-$(uuidgen)"
    requires:
      vars: [
        "MARIADB_PORT",
        "MARIADB_DATABASE",
        "SPIDER_STORAGE_DB_USERNAME",
        "SPIDER_STORAGE_DB_PASSWORD"
      ]
    dir: "{{.ROOT_DIR}}"
    deps: ["toolchains:rust"]
    cmds:
      - "mkdir -p ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}"
      - defer: "rm -rf ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}"
      - |-
        . "{{.G_RUST_TOOLCHAIN_ENV_FILE}}"
        cargo build --release --workspace --all-features
        mkdir -p "{{.G_TDL_PACKAGES_DIR}}/complex" \
                 "{{.G_TDL_PACKAGES_DIR}}/integration_test_tasks"
        cp "{{.G_RUST_RELEASE_DIR}}/libhuntsman_complex.so" \
           "{{.G_TDL_PACKAGES_DIR}}/complex/libcomplex.so"
        cp "{{.G_RUST_RELEASE_DIR}}/libintegration_test_tasks.so" \
           "{{.G_TDL_PACKAGES_DIR}}/integration_test_tasks/libintegration_test_tasks.so"
        cargo nextest run --all --all-features --run-ignored all --release \
          -E 'not (package(e2e) & kind(test))'
      - |-
        for f in ${SPIDER_TEST_INSTRUMENT_OUTPUT_DIR}/*; do
          if [ -f "$f" ]; then
            echo "=== Instrument: $(basename "$f") ==="
            cat "$f"
            echo ""
          fi
        done

  # End-to-end fault-recovery tests against the docker-compose Spider stack
  # (`tools/docker/docker-compose.e2e.yml`). Stages the `nn` TDL package, generates per-service
  # configs from `tools/scripts/stack/spider-compose.yaml`, brings one shared stack up on the
  # `spider_net` user-defined bridge network, runs every `fault_recovery` test in a single nextest
  # invocation, and tears the stack down.
  #
  # The compose stack attaches each service to the `spider_net` bridge with a static IP, so the test
  # driver (this process) reaches the storage gRPC server at `http://172.40.0.30:50051` (the host
  # routes to the bridge subnet). The fault controller shells out to `docker compose` to stop/start
  # workers mid-job. All fault tests share this one stack, so they are serialized with
  # `#[serial_test::file_serial(compose_fault)]`: nextest runs each test in its own process, and the
  # `file_locks` feature serializes them across processes via a file lock keyed by the `compose_fault`
  # group. No `--test-threads` flag is needed, and the named group lets tests using a different
  # stack/config later run in parallel under a different group.
  e2e-compose-fault:
    vars:
      COMPOSE_FILE: "{{.G_COMPOSE_FILE}}"
      COMPOSE_PROJECT: "{{.G_COMPOSE_PROJECT}}"
      G_RUST_RELEASE_DIR: "{{.G_RUST_BUILD_DIR}}/release"
      G_TDL_PACKAGES_DIR: "{{.G_BUILD_DIR}}/tdl_packages"
      G_COMPOSE_CONFIG_DIR: "{{.G_BUILD_DIR}}/spider-compose"
    deps:
      - ":build:rust"
    dir: "{{.ROOT_DIR}}"
    cmds:
      - task: "compose-stage-packages"
        vars:
          G_RUST_RELEASE_DIR: "{{.G_RUST_RELEASE_DIR}}"
          G_TDL_PACKAGES_DIR: "{{.G_TDL_PACKAGES_DIR}}"
      - task: "compose-gen-configs"
        vars:
          G_COMPOSE_CONFIG_DIR: "{{.G_COMPOSE_CONFIG_DIR}}"
      - cmd: >-
          docker compose -f "{{.COMPOSE_FILE}}" -p "{{.COMPOSE_PROJECT}}" down -v || true
      - cmd: >-
          docker compose -f "{{.COMPOSE_FILE}}" -p "{{.COMPOSE_PROJECT}}" up -d --build --wait
      - defer: >-
          docker compose -f "{{.COMPOSE_FILE}}" -p "{{.COMPOSE_PROJECT}}" down -v
      - |-
        . "{{.G_RUST_TOOLCHAIN_ENV_FILE}}"
        SPIDER_ENDPOINT="http://172.40.0.30:50051" \
        SPIDER_COMPOSE_FILE="{{.COMPOSE_FILE}}" \
        SPIDER_COMPOSE_PROJECT="{{.COMPOSE_PROJECT}}" \
        cargo nextest run -p e2e --test fault_recovery --release

  # Stages the `nn` TDL package so the in-container task executor can dlopen it at
  # `<package_dir>/nn/libnn.so`. `libnn.so` is the C-ABI cdylib built from the `huntsman-nn-tasks`
  # crate (lib name `nn`).
  compose-stage-packages:
    internal: true
    vars:
      G_RUST_RELEASE_DIR: "{{.G_RUST_BUILD_DIR}}/release"
      G_TDL_PACKAGES_DIR: "{{.G_BUILD_DIR}}/tdl_packages"
    cmds:
      - "mkdir -p '{{.G_TDL_PACKAGES_DIR}}/nn'"
      - "cp '{{.G_RUST_RELEASE_DIR}}/libnn.so' '{{.G_TDL_PACKAGES_DIR}}/nn/libnn.so'"

  # Derives `gen-storage.yaml`, `gen-scheduler.yaml`, and `gen-em.yaml` from the global
  # `spider-compose.yaml` via `generate.py` (ported from the `integration-test-stack` branch).
  compose-gen-configs:
    internal: true
    vars:
      G_COMPOSE_CONFIG_DIR: "{{.G_BUILD_DIR}}/spider-compose"
    cmds:
      - "mkdir -p '{{.G_COMPOSE_CONFIG_DIR}}'"
      - >-
        uv run --script tools/scripts/stack/generate.py
        --config tools/scripts/stack/spider-compose.yaml
        --output-dir '{{.G_COMPOSE_CONFIG_DIR}}'
