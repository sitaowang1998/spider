# Docker-compose stack for Spider end-to-end tests with fault injection.
#
# Brings up MariaDB, the storage gRPC server, the scheduler, and N execution-manager workers so the
# e2e test driver (`tests/huntsman/e2e`) can submit jobs and (in the fault tests) stop/restart
# individual services mid-job. Driven by the `e2e-compose-fault` task in `taskfiles/test.yaml`,
# which generates per-service configs from `tools/scripts/stack/spider-compose.yaml` via
# `tools/scripts/stack/generate.py` before bringing this stack up.
#
# Network: every service attaches to the `spider_net` user-defined bridge network with static
# IPv4 addresses. This is required because the Rust config schema deserializes every endpoint
# `host` as `IpAddr`, which rejects DNS service names -- static bridge IPs satisfy `IpAddr`, so the
# storage/scheduler listen on their own bridge IP and clients (other services and the host test
# driver) connect to that IP. Each container gets its OWN network namespace, which is what makes
# fault recovery work: when the scheduler/storage container is stopped and restarted mid-job it
# gets a fresh namespace with no lingering TIME_WAIT sockets, and execution managers connect to
# the scheduler's bridge IP (not a shared loopback), so the listen port can never be handed out as
# an outbound connect's source port -- eliminating the self-connect that wedged restarts under
# `network_mode: host`. Workers use a dynamic bridge IP (nothing connects to them; they poll). The
# host test driver reaches storage at `http://172.40.0.30:50051` (the host routes to the bridge).
#
# Images: each spider service builds against the existing `tools/docker/Dockerfile` target
# (`storage` / `scheduler` / `worker`), which copies the release binaries into `/usr/local/bin`.
# `docker compose up --build` builds them (cached after the first `task docker:build`).
#
# Fault injection: the Rust `ComposeFaultController` shells out to
# `docker compose -f <this file> -p <project> {stop|start|restart} <service>`. `stop` halts a
# container without removing it (the `restart: unless-stopped` policy does NOT revive a
# manually-stopped container), and `start` brings it back -- exactly the failure/restart primitive
# the fault tests need.

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    networks:
      spider_net:
        ipv4_address: 172.40.0.20
    environment:
      MYSQL_DATABASE: spider-db
      MYSQL_USER: spider-user
      MYSQL_PASSWORD: spider-password
      MYSQL_ROOT_PASSWORD: spider-root-password
    # The storage service connects to this container's bridge IP (172.40.0.20:3306, set in
    # spider-compose.yaml). MariaDB binds 0.0.0.0 by default, so it is reachable at that IP.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  storage:
    build:
      context: "../.."
      dockerfile: "tools/docker/Dockerfile"
      target: storage
    restart: unless-stopped
    networks:
      spider_net:
        ipv4_address: 172.40.0.30
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      RUST_LOG: info
    volumes:
      # Per-service config generated by generate.py from the global spider-compose.yaml.
      - ../../build/spider-compose:/spider/config:ro
    command: ["spider-storage", "--config", "/spider/config/gen-storage.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/172.40.0.30/50051'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  scheduler:
    build:
      context: "../.."
      dockerfile: "tools/docker/Dockerfile"
      target: scheduler
    restart: unless-stopped
    networks:
      spider_net:
        ipv4_address: 172.40.0.40
    depends_on:
      storage:
        condition: service_healthy
    environment:
      RUST_LOG: info
    volumes:
      - ../../build/spider-compose:/spider/config:ro
    command: ["spider-scheduler", "--config", "/spider/config/gen-scheduler.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/172.40.0.40/50052'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker-1:
    &worker
    build:
      context: "../.."
      dockerfile: "tools/docker/Dockerfile"
      target: worker
    restart: unless-stopped
    networks:
      - spider_net
    depends_on:
      scheduler:
        condition: service_healthy
    environment:
      RUST_LOG: info
    volumes:
      - ../../build/spider-compose:/spider/config:ro
      # Staged TDL packages (build/tdl_packages/nn/libnn.so) mounted read-only so the task executor
      # can dlopen the nn package.
      - ../../build/tdl_packages:/spider/packages:ro
    # No run-dir volume: the worker image runs as non-root `spider-user`, whose home dir
    # (`/home/spider-user`) is owned by that user, and `run_dir` in spider-compose.yaml points
    # there. The execution manager `create_dir_all`s its `em-logs` subdir under the home dir and
    # writes executor logs into the container's writable layer -- no volume needed (a named volume
    # at a root-owned path would be root-owned and unwritable by `spider-user`).
    # No healthcheck: the EM polls the scheduler (no inbound port), so it is ready once started and
    # registers with storage/scheduler on its own schedule.
    command: ["spider-execution-manager", "--config", "/spider/config/gen-em.yaml"]

  worker-2:
    <<: *worker
  worker-3:
    <<: *worker
  worker-4:
    <<: *worker

# User-defined bridge network with static IPv4 addresses for the services that are connect
# targets (mariadb, storage, scheduler); workers attach without a static address and get a
# dynamic IP from the pool (nothing connects to them -- they poll the scheduler). The static IPs
# match the endpoint hosts in `tools/scripts/stack/spider-compose.yaml` so `generate.py` emits
# configs that both listen on and connect to these addresses.
networks:
  spider_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1